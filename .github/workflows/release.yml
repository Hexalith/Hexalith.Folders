name: Release

# Publication is an explicit operator action. The unprotected source proof runs
# before the protected production environment can expose publication credentials.
on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify exact green main source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require current main with successful exact-source CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Release must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatch source must be an exact lowercase commit SHA." >&2
            exit 1
          fi

          live_main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$live_main_sha" =~ ^[0-9a-f]{40}$ ]] || [ "$DISPATCH_SHA" != "$live_main_sha" ]; then
            echo "The dispatched source is no longer the exact live main tip." >&2
            exit 1
          fi

          ci_runs="$(gh api --method GET \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$DISPATCH_SHA" \
            -f status=success \
            -f per_page=100)"
          if ! printf '%s\n' "$ci_runs" | jq -e --arg sha "$DISPATCH_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )] | length > 0
          ' >/dev/null; then
            echo "No successful push CI run exists for the exact current main SHA." >&2
            exit 1
          fi

  release:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Prepare ordinary domain release
        id: prepare
        uses: Hexalith/Hexalith.Builds/Github/prepare-domain-release@f1c5f774975e1d9ffb77ef7e70d560f5e9ba8d3f
        with:
          solution: Hexalith.Folders.CI.slnx
          builds-execution-sha: f1c5f774975e1d9ffb77ef7e70d560f5e9ba8d3f
          source-branch: main
          source-ci-workflow: ci.yml
          package-manifest: tools/release-packages.json
          expected-package-count: 5
          nuget-user: ${{ vars.NUGET_USER }}
      - name: Authenticate NuGet trusted publishing
        id: nuget-login
        if: ${{ steps.prepare.outputs.publish-enabled == 'true' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Semantic Release
        if: ${{ steps.prepare.outputs.publish-enabled == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          HEXALITH_BUILDS_EXECUTION_SHA: f1c5f774975e1d9ffb77ef7e70d560f5e9ba8d3f
          HEXALITH_RELEASE_ENVIRONMENT: production
          HEXALITH_RELEASE_SOURCE_BRANCH: main
          HEXALITH_RELEASE_SOURCE_CI_WORKFLOW: ci.yml
          HEXALITH_RELEASE_PACKAGE_MANIFEST: tools/release-packages.json
          HEXALITH_RELEASE_EXPECTED_PACKAGE_COUNT: '5'
          HEXALITH_RELEASE_REQUIRE_AUTHORITY: 'false'
        run: npm exec --no -- semantic-release
      - name: Retain failed release package report
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: _bmad-output/gates/release-packages/latest.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain failed release package archives
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-archives-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
          retention-days: 7
          if-no-files-found: ignore
