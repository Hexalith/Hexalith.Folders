name: Release

# Publication is an explicit operator action. The unprotected source proof runs
# before the protected production environment can expose publication credentials.
on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify exact green main source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require current main with successful exact-source CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Release must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatch source must be an exact lowercase commit SHA." >&2
            exit 1
          fi

          live_main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$live_main_sha" =~ ^[0-9a-f]{40}$ ]] || [ "$DISPATCH_SHA" != "$live_main_sha" ]; then
            echo "The dispatched source is no longer the exact live main tip." >&2
            exit 1
          fi

          ci_runs="$(gh api --method GET \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$DISPATCH_SHA" \
            -f status=success \
            -f per_page=100)"
          if ! printf '%s\n' "$ci_runs" | jq -e --arg sha "$DISPATCH_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )] | length > 0
          ' >/dev/null; then
            echo "No successful push CI run exists for the exact current main SHA." >&2
            exit 1
          fi

  release:
    needs: verify-source
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-release.yml@b93e9889e9e7b67036837015b4b2b115e326c4da
    with:
      solution: Hexalith.Folders.CI.slnx
      timeout-minutes: 60
      test-platform: microsoft-testing-platform
      environment-name: production
      governed-release: false
      publish-containers: false
      builds-execution-sha: b93e9889e9e7b67036837015b4b2b115e326c4da
      source-branch: main
      source-ci-workflow: ci.yml
      package-manifest: tools/release-packages.json
      expected-package-count: 5
      require-publication-authority: false
      test-projects: ''
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
