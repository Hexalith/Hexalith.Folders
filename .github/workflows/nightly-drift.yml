name: nightly-drift

'on':
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      provider_profile:
        description: 'Bounded provider profile for drift evidence'
        required: true
        default: 'pinned-snapshots'
        type: choice
        options:
          - pinned-snapshots
          - latest-supported

permissions:
  contents: read

jobs:
  nightly-drift-gates:
    name: nightly-drift-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize root-level build submodules
        run: git submodule update --init --checkout references/Hexalith.AI.Tools references/Hexalith.Builds references/Hexalith.Commons references/Hexalith.EventStore references/Hexalith.FrontComposer references/Hexalith.Memories references/Hexalith.PolymorphicSerializations references/Hexalith.Tenants

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            nuget.config
            **/*.csproj

      - name: Restore
        run: dotnet restore Hexalith.Folders.CI.slnx -m:1 -p:Configuration=Release -p:UseNuGetDeps=true

      - name: Build
        run: dotnet build Hexalith.Folders.CI.slnx --no-restore -m:1 --configuration Release -p:UseNuGetDeps=true

      # One command covers both hermetic provider lanes: the Forgejo pinned-snapshot manifest and the
      # GitHub pinned-profile manifest plus its C12 failure-mode coverage matrix. Neither makes a network call.
      - name: Run nightly provider drift gates
        shell: pwsh
        timeout-minutes: 20
        run: ./tests/tools/run-nightly-drift-gates.ps1 -SkipRestoreBuild -Configuration Release -ProviderProfile '${{ inputs.provider_profile || 'pinned-snapshots' }}'

      - name: Run Forgejo Alpine smart-HTTP smoke
        shell: pwsh
        timeout-minutes: 30
        run: ./tests/tools/run-forgejo-smart-http-alpine-smoke.ps1
