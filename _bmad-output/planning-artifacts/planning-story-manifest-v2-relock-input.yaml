      - Stable URI logical event type independent of CLR and assembly names.
      - Positive eventPayloadSchemaVersion distinct from EventStore MetadataVersion.
      - Deterministic complete upcaster registry and fail-closed chain validation.
      - Closed legacy EventTypeName alias inventory with retained historical byte fixtures.
