    required_evidence:
      - Dapr state.postgresql component generation v2 actor-state and replay compatibility.
      - Transactional actor-state behavior under the supported multi-replica profile.
      - Physical backup and cross-region WAL/PITR restore proof.
      - Signed metadata-only recovery-safety export with KMS signer and monotonic watermark.
