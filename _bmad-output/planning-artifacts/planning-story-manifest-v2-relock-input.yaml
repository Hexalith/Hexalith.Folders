ordinary_execution_control:
  universal_prerequisite: DEC-A8-HOLD
  applies_to:
    - Every ordinary story at rank 10 or later.
    - Every delivery-evidence node at rank 10 or later.
  expansion_required: true
  status_while_hold_true: held
  relock_only_nodes:
    - RELOCK-PLANNING
    - 1.17-GENERATE
    - RELOCK-SECTION9
  relock_lane_prohibitions:
    - No production v2 exposure or publication.
    - No story lifecycle closure.
    - No OQ5-OQ13 runtime evidence generation.

validation_rules:
  - id: V2-001
    rule: Parse as YAML and require manifest_version exactly 2.
  - id: V2-002
    rule: Require every canonical story identity exactly once; permit only the declared 2.8b alias row.
  - id: V2-003
    rule: Require 158 canonical story identities and 159 inventory rows including aliases.
  - id: V2-004
    rule: Require exact FR1-FR58 and NFR1-NFR84 identities with no gap, duplicate, or renumbering.
  - id: V2-005
    rule: Require every scheduled nonterminal node to carry exactly one integer execution_rank.
  - id: V2-006
    rule: Reject a missing prerequisite node or duplicate prerequisite edge.
  - id: V2-007
    rule: Reject cycles in the expanded prerequisite graph.
  - id: V2-008
    rule: Reject an unresolved prerequisite whose rank is equal to or later than the dependent rank.
  - id: V2-009
    rule: Reject an unranked nonterminal prerequisite.
  - id: V2-010
    rule: Permit a rankless terminal prerequisite only when accepted evidence_path exists and validates.
  - id: V2-011
    rule: Require DEC-A8-HOLD as an explicitly expanded edge on every ordinary story and delivery-evidence node at rank 10 or later.
  - id: V2-012
    rule: Require general_execution_hold true until RELOCK-SECTION9 is accepted and A8 contains all required exact-digest approvals.
  - id: V2-013
    rule: Reject ordinary execution_authorization_status other than held while the general hold is true.
  - id: V2-014
    rule: Limit relock-only authorization to the three declared relock nodes and their artifact allow-lists.
  - id: V2-015
    rule: Reject accepted external nodes without repository owner, accountable role, source work or escalation reference, release_identifier, immutable release version or commit, evidence path, and acceptance record.
  - id: V2-016
    rule: Reject an external acceptance record containing placeholder, pending, unknown, TODO, TBD, or self-declared approval values.
  - id: V2-017
    rule: Require story_lifecycle_status as the only current lifecycle field and classify frozen specification status only as workflow_snapshot_status.
  - id: V2-018
    rule: Require separate decision_status, execution_authorization_status, and delivery_evidence_status on every decision or evidence node.
  - id: V2-019
    rule: Require OQ3 superseded-pending-reapproval until an accepted exact-digest DEC-A6B-OQ3 record exists for matrix 2.0.0.
  - id: V2-020
    rule: Reject any edge from 12.6 to OQ8-EVIDENCE; require accepted OQ8-DESIGN to precede 12.6 and OQ8-EVIDENCE to follow it.
  - id: V2-021
    rule: Require the four new story IDs as backlog without renumbering or deleting any completed historical identity.
  - id: V2-022
    rule: Require the lifecycle reconciliation journal and preserve every cited frozen evidence artifact byte-for-byte.
  - id: V2-023
    rule: Require governance status superseded-pending-reapproval in schema, data, and both affected conformance tests in one Delivery change.
  - id: V2-024
    rule: Require status-code and error-vocabulary fingerprints in previous-spine and regenerate OpenAPI, client, CLI/MCP parity, C13, docs, and tests as one v2 candidate set.
  - id: V2-025
    rule: Reject sprint-status regeneration or a general hold change in the bmad-create-epics-and-stories pass.
