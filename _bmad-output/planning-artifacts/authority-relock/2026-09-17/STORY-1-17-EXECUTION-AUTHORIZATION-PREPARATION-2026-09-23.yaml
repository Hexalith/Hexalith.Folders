deferred_findings_triage:
  source: _bmad-output/implementation-artifacts/review-1-17-generate-scoped-a6b-2026-09-22.md
  source_sha256: c1346b762de7135f5c66ac4d46cfe0f853d7caf48cf5df4a2f72cce53e631b6e
  counts: {must_fix_before_closure: 8, follow_up_story: 6, accepted_residual_risk: 3, total: 17}
  follow_up_admission_note: Proposed story 1.18 does not exist. Admitting it requires a bmad-correct-course change (canonical count 158 to 159 under V2-003). Mappings onto existing stories 11.6 and 13.2 need only scope annotation in that change.
  findings:
    - id: F01
      ref: BH16-12 remainder
      summary: EffectivePermissions.permissions and CommitEvidence.auditMetadataKeys deserialize an omitted member to an empty list.
      disposition: follow-up-story
      owner: Proposed 1.18 PD10 v2 generator and SDK strictness hardening (Delivery / Contract)
      rationale: Fails restrictive; no authorization or disclosure effect; generator post-processor fix.
    - id: F02
      ref: BH16-13
      summary: Unknown members on additionalProperties false success bodies are silently ignored client-side.
      disposition: accepted-residual-risk
      rationale: Client-side tolerant reading has no server authorization or disclosure effect; the server seam validates emitted shapes.
    - id: F03
      ref: BH16-05
      summary: CanonicalAccessState returns negativeStates[0], so [revoked, stale] yields 404 while [stale, revoked] yields 503.
      disposition: must-fix-before-closure
      rationale: Confirmed at Pd10V2CandidateCompatibilitySeam.cs:1547. A nondeterministic 404/503 choice violates AC3's single canonical outcome per authority class.
    - id: F04
      ref: BH16-08
      summary: Final reauthorization in FolderCreationService, RepositoryBackedFolderCreationService, and ConfigureProviderBindingService uses includeFolderAcl false, although the initial AuthorizeAsync includes it.
      disposition: must-fix-before-closure
      rationale: Confirmed at FolderCreationService.cs:118 versus LayeredFolderAuthorizationService.cs:24. A time-of-check to time-of-use gap at the effect boundary contradicts the claimed complete-stack final check.
    - id: F05
      ref: BH16-07
      summary: Folderless StrictRead operations run validator and Dapr layers with LayeredFolderOperationPolicy.Mutation().
      disposition: follow-up-story
      owner: Existing 13.2 Fail-safe fallback authorization policy (Security / Delivery)
      rationale: Mutation and StrictRead have identical staleness strictness and differ only in the class code and invocation class, so the effect is a label/policy-match defect that fails closed.
    - id: F06
      ref: BH16-15
      summary: The conformance inventory is a hand-kept allowlist read by its own test (circular); the gitlink binding was dropped.
      disposition: follow-up-story
      owner: Proposed 1.18 (Delivery / Architecture)
      rationale: No omission today (verified by the reviewer); governance-tooling hardening against future drift.
    - id: F07
      ref: generator example overwrite
      summary: The generator overwrites example status and feeds 422/423/428/429 examples into the runtime catalog instead of failing on mismatch.
      disposition: follow-up-story
      owner: Proposed 1.18 (Delivery / Contract)
      rationale: The new validate_declared_statuses_have_runtime_tuples guard covers the blocking class; this closes residual drift masking.
    - id: F08
      ref: missing regressions
      summary: Claimed fixes lack regression tests (CLI/MCP freshness mismatch, 409 to 423/428 remap, per-service final-reauth revocation race, case-variant duplicate JSON, parity absent-from-v1 branch, EC16-05 baseline-init validation, MCP lock_conflict projection).
      disposition: must-fix-before-closure
      rationale: AC8 requires passing tests for the closure behaviors; an unpinned security fix (revocation race) is unverified.
    - id: F09
      ref: base-URL path prefix
      summary: Typed-problem projection fails closed when the SDK BaseUrl carries a path prefix.
      disposition: follow-up-story
      owner: Existing 11.6 Consolidate CLI/MCP adapter core and secure bearer transport (Delivery)
      rationale: Fails closed; affects only prefixed deployments. Story 13.7 must either forbid path-prefixed base URLs or depend on this fix.
    - id: F10
      ref: CLI/MCP freshness descriptions
      summary: CLI --freshness and MCP descriptions advertise three values while each operation accepts one; a test-only ParseFreshness overload defaults to ListAuditTrail.
      disposition: follow-up-story
      owner: Existing 11.6 (Delivery)
      rationale: Help-text accuracy only; runtime rejects invalid values with the established usage failure.
    - id: F11
      ref: Event 1018 logging
      summary: LogAuthorizationEvaluationFailed (EventId 1018, Error) logs the full exception.
      disposition: must-fix-before-closure
      rationale: Settle before production v2 routing. Prove that authorization exceptions carry no tenant or principal values (and pin that with a test), or redact. The production floor requires metadata-only sensitive-data exclusion.
    - id: F12
      ref: PrepareWorkspace 422 example
      summary: The 422 example content is copied from the lock scenario.
      disposition: accepted-residual-risk
      rationale: Cosmetic documentation with no runtime effect; may be corrected opportunistically in the closure reseal.
    - id: F13
      ref: archive PrincipalId
      summary: Archive final reauthorization passes ActorSafeIdentifier as PrincipalId.
      disposition: must-fix-before-closure
      rationale: Settle by asserting actor-safe id equals principal id on the /process path. If they diverge, the final check evaluates the wrong principal.
    - id: F14
      ref: PRE-EXISTING ValidateProviderReadinessAsync
      summary: The generated SDK binds success to ProviderReadinessConsumer, while the server returns audience authorized_operator, so every real 200 throws in the SDK (pinned by GoldenLifecycleParityTests).
      disposition: must-fix-before-closure
      rationale: Closure makes the v2 SDK consumable at rank 10. A protected operation whose success is unusable through the published SDK is a material contract defect in 1.17 scope.
    - id: F15
      ref: PRE-EXISTING UI freshness
      summary: UI pages send eventually_consistent to operations that the v2 seam restricts to another class.
      disposition: must-fix-before-closure
      rationale: Slice 1.17-E owns UI contract consumption. After the v2 cutover these pages would receive 400, a material behavioral delta.
    - id: F16
      ref: PRE-EXISTING undeclared repository-backed tuples
      summary: The create/bind fallback 422 provider_readiness_failed and details.finalState on reconciliation_required and unknown_provider_outcome are undeclared and collapse to the canonical 503.
      disposition: must-fix-before-closure
      rationale: Same class as the blocking 429 finding. Closure applies "admits every reachable response" to all 49 operations, and collapsing unknown_provider_outcome to a retryable 503 discards the reconciliation signal.
    - id: F17
      ref: CanonicalErrorCode renumbering
      summary: CanonicalErrorCode members were renumbered by inserting Unsupported_provider_capability.
      disposition: accepted-residual-risk
      rationale: v2 is unreleased with no consumers. The numbering becomes the baseline at closure; pin it with a test and record it in release notes.

