authority_basis:
  finding: No existing gate, validation rule, or register record defines the held-to-authorized transition for an ordinary story. The decision is therefore new and must be explicitly signed; it cannot be derived from A8 or from hold removal.
  evidence:
    - source: _bmad-output/planning-artifacts/authority-relock/2026-09-17/A8-CORRECTIVE-RELOCK-APPROVAL-2026-09-22.yaml
      statement: preserved_boundaries - "Hold removal does not by itself authorize any ordinary story execution, Story 1.17 closure, or v2 exposure or routing."
    - source: _bmad-output/planning-artifacts/planning-story-manifest.yaml#ordinary_execution_control
      statement: Defines only status_while_hold_true held, universal_prerequisite DEC-A8-HOLD, and relock-only nodes; it defines no status or authority for hold-false ordinary execution.
    - source: _bmad-output/planning-artifacts/planning-story-manifest.yaml#status_model
      statement: execution_authorization_status_vocabulary is [completed, held, relock-only, not-applicable, external-owner-controlled]; no authorized value exists. Rule "A design approval never implies execution authorization."
    - source: _bmad-output/planning-artifacts/planning-story-manifest.yaml#validation_rules
      statement: V2-011 requires DEC-A8-HOLD on every rank>=10 ordinary node (satisfied); V2-012 requires hold true until Section 9 accepted and A8 exact-digest approvals exist (now satisfied, hold false); V2-013 rejects non-held ordinary status only while the hold is true (not currently triggered); V2-014 limits relock-only authorization to RELOCK-PLANNING, 1.17-GENERATE, and RELOCK-SECTION9 (Story 1.17 cannot be executed as relock-only).
    - source: _bmad-output/planning-artifacts/architecture.md (rank 7 and rank 10 rows; execution-hold semantics)
      statement: Rank 10 is "the canonical story's post-freeze closure/consumption boundary"; candidate generation already happened in the relock lane.
    - source: _bmad-output/planning-artifacts/planning-authority-relock-approval-register.yaml#approval_policy
      statement: infer_approval false; named human approver; approval date; exact payload digest; generic tokens rejected; reopen on payload or bound-artifact digest change. recording_rules require per-authority signatures that name the authority represented.
  proposed_gate_id: DEC-EXEC-1.17
  required_authorities_rationale:
    Product: Precedent A8 (execution-state change) and A6 (PD10 scope).
    Architecture: Precedent A8 and A6/A6b; owns rank/graph semantics and the vocabulary amendment.
    Security: Precedent A6/A6b for the PD10 authorization spine; required to sign the accepted-residual-risk dispositions below, which concern authorization and client-side validation behavior.
    Delivery: Precedent A8 and A3; owns execution authorization, lifecycle, and tracker handling.
  signature_rule: Jerome may sign all four authorities only with an explicit per-authority statement; identity alone implies no role.

