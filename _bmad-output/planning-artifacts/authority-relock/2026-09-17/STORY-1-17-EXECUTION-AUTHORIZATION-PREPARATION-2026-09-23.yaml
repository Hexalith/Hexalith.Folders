blocking_structural_findings:
  - id: SF-1
    title: Story 1.17 closure requires v2 production routing
    evidence: epics.md Story 1.17 AC1 "v1 remains historical evidence and is not exposed by the supported production profile"; final AC "the build contains no supported-production route or client target that still selects v1". Program.cs currently maps only historical /api/v1 endpoints; the v2 seam is test-only.
    consequence: Closure cannot be achieved without a separate v2 exposure and routing decision. This package does not request that decision, and execution authorization alone cannot close Story 1.17.
  - id: SF-2
    title: Executing 1.17 on main would invalidate A6b and A8 and reinstate the hold
    evidence: A6b and corrective A8 bind the conformance set 4c8f33f0, the matrix d5daa483, and sprint-status 230889ef. Register policy reopens a gate on any bound-artifact digest change; V2-012 then requires the hold true, and V2-013 would force Story 1.17 back to held. The 2026-09-22 reopen is the precedent.
    consequence: Every must-fix below changes at least one of the 196 bound artifacts. Main must stay byte-stable for those artifacts until one atomic closure change carries re-approvals.
  - id: SF-3
    title: No vocabulary value for an authorized ordinary story
    evidence: status_model.execution_authorization_status_vocabulary lacks an authorized value.
    consequence: Recording approval requires an exact vocabulary amendment in the manifest (Architecture + Delivery), made in the same change that records DEC-EXEC-1.17.
  - id: SF-4
    title: Stopped draft spec and open GENERATE evidence
    evidence: spec-1-17-publish... is draft with frozen intent "Decision stop. Story 1.17 stays backlog."; the 1.17-GENERATE node has delivery_evidence_status open, and its spec is in-progress at review_loop_iteration 13.
    consequence: Execution needs a renegotiated 1.17 spec (new frozen intent), and closure needs accepted 1.17-GENERATE delivery evidence.

