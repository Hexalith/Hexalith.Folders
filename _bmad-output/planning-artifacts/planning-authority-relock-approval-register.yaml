  - A human approval record must contain authority, approver, approved_on, payload_version, and payload_sha256.
  - A post-output record must also contain every required bound artifact path and its exact SHA-256 digest.
  - One person may sign multiple authorities only when the record explicitly states the authority represented for each signature; identity alone never implies a role.
  - Sponsor routing does not populate any approvals list.
  - A payload or bound-artifact digest change invalidates the affected records and returns the gate to pending.
  - A8 cannot be recorded before every earlier required record is complete and RELOCK-SECTION9 is passing.
