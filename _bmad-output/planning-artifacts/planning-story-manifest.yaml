- id: V2-016
  rule: Reject an external acceptance record containing placeholder, pending, unknown, TODO, TBD, or self-declared approval values.
- id: V2-017
  rule: Require story_lifecycle_status as the only current lifecycle field and classify frozen specification status only as workflow_snapshot_status.
- id: V2-018
  rule: Require separate decision_status, execution_authorization_status, and delivery_evidence_status on every decision or evidence node.
- id: V2-019
