# Sanitized production sidecar binding conformance artifact.
# These are Kustomize-style patch fragments; deployment tooling owns images, ports, and secret material; this file owns required references.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexalith-eventstore
  namespace: hexalith-production
spec:
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: eventstore
        dapr.io/config: hexalith-folders-production-accesscontrol-eventstore
    spec:
      # Story 10.3 (D1): the EventStore actor host MUST publish managed-tenant folder domain events to the single
      # folders.events topic the worker subscribes on /folders/events. Without this override folder events publish
      # to {tenantId}.folders.events and the worker never receives them, so semantic indexing silently never fires.
      # Deployment tooling owns the image/registry/ports; this functional publish-topic override is repo-owned and
      # pinned by ContainerImageConformanceTests (kept in lockstep with the AppHost helper for dev parity).
      containers:
        - name: eventstore
          env:
            - name: EventStore__Publisher__TopicOverrides__folders
              value: folders.events
            - name: Authentication__WorkloadIssuer__ClientId
              valueFrom:
                secretKeyRef:
                  name: hexalith-eventstore-workload-client
                  key: client-id
            - name: Authentication__WorkloadIssuer__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: hexalith-eventstore-workload-client
                  key: client-secret
            - name: EventStore__IdempotencyAdmission__Enabled
              value: "true"
            - name: EventStore__IdempotencyAdmission__DigestKeySource
              value: DaprSecret
            - name: EventStore__IdempotencyAdmission__ActiveDigestKeyVersion
              valueFrom:
                secretKeyRef:
                  name: hexalith-eventstore-idempotency-keys
                  key: active-version
            - name: EventStore__IdempotencyAdmission__DigestKeySecretStoreName
              value: kubernetes
            - name: EventStore__IdempotencyAdmission__DigestKeySecretName
              value: hexalith-eventstore-idempotency-keys
            - name: EventStore__IdempotencyAdmission__DigestKeySecretGeneration
              valueFrom:
                secretKeyRef:
                  name: hexalith-eventstore-idempotency-keys
                  key: generation
            - name: Authentication__HumanAuthorityReceipt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: hexalith-human-authority-receipt-signing-key
                  key: signing-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexalith-tenants
  namespace: hexalith-production
spec:
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: tenants
        dapr.io/config: hexalith-folders-production-accesscontrol-tenants
        dapr.io/app-token-secret: hexalith-tenants-app-token
    spec:
      containers:
        - name: tenants
          env:
            - name: APP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hexalith-tenants-app-token
                  key: token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexalith-folders-server
  namespace: hexalith-production
spec:
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: folders
        dapr.io/config: hexalith-folders-production-accesscontrol-folders
        dapr.io/app-token-secret: hexalith-folders-server-app-token
    spec:
      containers:
        - name: folders
          env:
            - name: APP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hexalith-folders-server-app-token
                  key: token
            - name: Authentication__HumanAuthorityReceipt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: hexalith-human-authority-receipt-signing-key
                  key: signing-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexalith-folders-workers
  namespace: hexalith-production
spec:
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: folders-workers
        dapr.io/config: hexalith-folders-production-accesscontrol-folders-workers
        dapr.io/app-token-secret: hexalith-folders-workers-app-token
    spec:
      containers:
        - name: workers
          env:
            - name: Folders__Workers__PubSubName
              value: folders-workers-pubsub
            - name: APP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hexalith-folders-workers-app-token
                  key: token
---
