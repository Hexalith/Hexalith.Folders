x-hexalith-idempotency-key:
  summary: Mutating-operation idempotency key rule.
  allowedLocations:
    - OpenAPI Operation Object for future mutating commands
    - Extension vocabulary definition
  requirement: Required for mutating operations; forbidden for non-mutating query operations.
  referencePendingPolicy: Missing C3/C4/S-2/C6 values must be documented as reference-pending rather than invented.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
    description: Foundation-mode declaration shape used at the top of the Contract Spine. Operation-mode usage uses valueSchema.
  valueSchema:
    type: object
    required:
      - required
      - adapterSourcing
      - missingBehavior
      - malformedBehavior
      - queryBehavior
    properties:
      required:
        type: boolean
      adapterSourcing:
        type: array
        items:
          type: string
      missingBehavior:
        type: string
      malformedBehavior:
        type: string
      queryBehavior:
        type: string
    description: Declares required mutating key behavior, adapter sourcing, malformed or missing-key handling, and non-use on queries.
  example:
    required: true
    adapterSourcing:
      - rest-header
      - sdk-caller-or-provider
      - cli-flag-or-allow-auto-key
      - mcp-input
    missingBehavior: validation_error
    malformedBehavior: validation_error
    queryBehavior: rejected-if-present
x-hexalith-idempotency-equivalence:
  summary: Tenant-scoped idempotency equivalence fields.
  allowedLocations:
    - OpenAPI Operation Object for future mutating commands
    - Extension vocabulary definition
  requirement: Required for future mutating operations and omitted for non-mutating operations.
  referencePendingPolicy: Field paths may reference later operation schemas only after those schemas exist.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: array
    items:
      type: string
      pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"
    uniqueItems: true
    description: Lexicographically ordered semantic field paths; tenant-scoped equivalence is mandatory.
  example:
    - credential_scope_class
    - folder_id
    - request_schema_version
    - task_id
    - workspace_id
x-hexalith-idempotency-ttl-tier:
  summary: Idempotency record retention tier.
  allowedLocations:
    - OpenAPI Operation Object for future mutating commands
    - Extension vocabulary definition
  requirement: Required for future mutating operations.
  referencePendingPolicy: Commit tier inherits C3 retention and remains reference-pending until Legal and PM approval.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: string
    enum:
      - mutation
      - commit
    description: Only mutation and commit are valid; mutation is 24h, commit is C3 retention backed.
  example: mutation
x-hexalith-correlation:
  summary: Correlation, causation, and task identity propagation.
  allowedLocations:
    - OpenAPI Operation Object
    - Reusable header or parameter components
    - Response metadata schemas
    - Extension vocabulary definition
  requirement: Required as shared vocabulary; operation-specific task requirements are declared later.
  referencePendingPolicy: Missing task-scoped operation inventories remain reference-pending until Stories 1.7-1.11 author them.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: object
    required:
      - correlationHeader
      - taskHeader
      - causation
      - adapterBehavior
    properties:
      correlationHeader:
        type: string
      taskHeader:
        type: string
      causation:
        type: string
      adapterBehavior:
        type: string
    description: Defines X-Correlation-Id, causation linkage, and X-Hexalith-Task-Id propagation.
  example:
    correlationHeader: X-Correlation-Id
    taskHeader: X-Hexalith-Task-Id
    causation: envelope-causation-reference
    adapterBehavior: caller-provided-or-generated-correlation
x-hexalith-authorization:
  summary: Tenant authority provenance and authorization behavior.
  allowedLocations:
    - OpenAPI Operation Object
    - Extension vocabulary definition
  requirement: Required for operations to declare tenant authority provenance, authorization layer, and safe-denial behavior.
  referencePendingPolicy: Runtime authorization handlers and concrete policy names are implemented by later stories; contract groups declare provenance and outcome class only.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: object
    additionalProperties: false
    required:
      - requirement
      - tenantAuthority
      - safeDenial
    properties:
      requirement:
        type: string
      tenantAuthority:
        type: string
      safeDenial:
        type: string
      order:
        type: array
        minItems: 1
        items:
          type: string
        description: "Optional structured ordered list of authorization stages. Stays alongside the prose `requirement` to enable machine consumption by parity oracles and adapter generators. Tokens are stable, lowercase, underscore-separated identifiers."
    description: Tenant authority must come from authentication context and EventStore envelopes; safe denials remain externally indistinguishable where existence is protected. The optional `order` array supplies a machine-readable form of the authorization stage sequence used by context queries.
  example:
    requirement: tenant-context-and-folder-read-permission
    tenantAuthority: authentication-context-and-eventstore-envelope
    safeDenial: externally-indistinguishable
    order:
      - tenant_access
      - folder_acl
      - path_policy
      - sensitivity_classification
      - c4_bounds
      - query_execution
x-hexalith-canonical-error-categories:
  summary: Operation-level canonical error category declaration.
  allowedLocations:
    - OpenAPI Operation Object
    - Extension vocabulary definition
  requirement: Required for operations to declare bounded canonical error categories consumed by parity work.
  referencePendingPolicy: Final parity oracle rows remain reference-pending until Story 1.13; operations still declare their bounded category vocabulary.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "../hexalith.folders.v1.yaml#/components/schemas/CanonicalErrorCategory"
    description: Bounded categories for one operation. Categories must not leak unauthorized resource existence.
  example:
    - tenant_access_denied
    - validation_error
    - internal_error
x-hexalith-read-consistency:
  summary: Non-mutating read consistency and freshness behavior.
  allowedLocations:
    - OpenAPI Operation Object for query or status operations
    - Extension vocabulary definition
  requirement: Required for non-mutating operations; those operations must not accept Idempotency-Key.
  referencePendingPolicy: C4 numeric freshness bounds remain reference-pending until approved; operations may declare class and behavior.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: object
    additionalProperties: false
    required:
      - class
      - freshnessBehavior
    properties:
      class:
        $ref: "../hexalith.folders.v1.yaml#/components/schemas/ReadConsistencyClass"
      freshnessBehavior:
        type: string
    description: Declares the operation read consistency class and metadata-only freshness evidence behavior.
  example:
    class: eventually_consistent
    freshnessBehavior: returns-projection-watermark-when-available
x-hexalith-query-timeout-ms:
  summary: Query timeout soft target in milliseconds.
  allowedLocations:
    - OpenAPI Operation Object for bounded query operations
    - Extension vocabulary definition
  requirement: Required for query operations that expose a canonical query_timeout category.
  referencePendingPolicy: C4 timeout values remain reference-pending until approved; declared values are soft targets, not raw implementation telemetry.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: integer
    minimum: 1
    description: Soft query timeout target in milliseconds; response telemetry must remain metadata-only.
  example: 2000
x-hexalith-lifecycle-states:
  summary: Workspace and task lifecycle vocabulary.
  allowedLocations:
    - Reusable schema or component definitions
    - Future operation metadata
    - Extension vocabulary definition
  requirement: Required as shared vocabulary; transition implementation is deferred to aggregate stories.
  referencePendingPolicy: C6 event-to-state transitions are documented elsewhere and must not be redefined here.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: object
    required:
      - states
      - terminalStates
      - retryability
      - operatorDispositionLabels
    properties:
      states:
        type: array
        items:
          type: string
      terminalStates:
        type: array
        items:
          type: string
      retryability:
        type: object
        additionalProperties:
          type: boolean
      operatorDispositionLabels:
        type: array
        items:
          type: string
    description: Describes states, terminal states, retryability, and operator-disposition labels without implementing transitions.
  example:
    states:
      - requested
      - ready
      - reconciliation_required
    terminalStates:
      - failed
      - inaccessible
    retryability:
      requested: true
      failed: false
    operatorDispositionLabels:
      - auto_recovering
      - awaiting_human
x-hexalith-parity-dimensions:
  summary: Reusable adapter parity dimensions.
  allowedLocations:
    - OpenAPI Operation Object for future operations
    - Extension vocabulary definition
  requirement: Required as vocabulary only; endpoint assertions and parity rows are downstream work.
  referencePendingPolicy: C13 parity oracle rows remain reference-pending until Story 1.13.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: object
    required:
      - transportParity
      - behavioralParity
      - adapterStages
    properties:
      transportParity:
        type: array
        items:
          type: string
      behavioralParity:
        type: array
        items:
          type: string
      adapterStages:
        type: array
        items:
          type: string
    description: Reusable vocabulary only for REST, SDK, CLI, and MCP parity dimensions; it does not create provider matrices or parity rows.
  example:
    transportParity:
      - rest
      - sdk
    behavioralParity:
      - cli_exit_code
      - mcp_failure_kind
    adapterStages:
      - pre-sdk
      - post-sdk
x-hexalith-audit-metadata-keys:
  summary: Metadata-only audit evidence key declarations.
  allowedLocations:
    - OpenAPI Operation Object
    - Reusable audit metadata schemas
    - Extension vocabulary definition
  requirement: Required when future operations emit audit evidence.
  referencePendingPolicy: Operation-specific audit keys remain reference-pending until their contract group story owns them.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    type: array
    items:
      type: object
      required:
        - name
        - sensitivity
        - description
      properties:
        name:
          $ref: "../hexalith.folders.v1.yaml#/components/schemas/AuditMetadataKey"
        sensitivity:
          $ref: "../hexalith.folders.v1.yaml#/components/schemas/SensitiveMetadataTier"
        description:
          type: string
    description: Metadata-only key declarations for allowed or denied operation evidence, correlation and task IDs, provider references, and sensitivity notes. Names must come from the spine AuditMetadataKey enum.
  example:
    - name: correlation_id
      sensitivity: tenant_sensitive
      description: Opaque correlation reference for tracing one request.
    - name: task_id
      sensitivity: tenant_sensitive
      description: Opaque task reference for task-scoped workflows.
x-hexalith-sensitive-metadata-tier:
  summary: Sensitive metadata classification.
  allowedLocations:
    - OpenAPI Schema Object
    - OpenAPI Property Schema Object
    - Future operation metadata
    - Extension vocabulary definition
  requirement: Required on future metadata fields that may carry tenant-sensitive or stricter values.
  referencePendingPolicy: Stricter tenant policies remain reference-pending until tenant policy contracts exist.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
      foundationUse:
        type: string
  valueSchema:
    $ref: "../hexalith.folders.v1.yaml#/components/schemas/SensitiveMetadataTier"
  example: tenant_sensitive
x-hexalith-decoded-byte-maximum:
  summary: Maximum decoded bytes carried by a base64-encoded string.
  allowedLocations:
    - OpenAPI Property Schema Object with contentEncoding base64
    - Extension vocabulary definition
  requirement: Required when a base64 string has a decoded-byte boundary that cannot be enforced by maxLength alone.
  referencePendingPolicy: The numeric value must come from an approved contract policy; the extension never invents a fallback.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
        minLength: 1
      foundationUse:
        type: string
        minLength: 1
  valueSchema:
    type: integer
    minimum: 0
    maximum: 2147483647
    description: Enforcing decoded-byte maximum for contentEncoding base64 after strict base64 decoding.
  example: 262144
x-hexalith-file-policy:
  summary: Canonical versioned file-policy vocabulary and behavior.
  allowedLocations:
    - OpenAPI root extension instance
    - Extension vocabulary definition
  requirement: Required as one closed root instance that binds every file operation and context query to the approved OQ2 policy.
  referencePendingPolicy: No fallback is permitted; an absent, invalid, stale, or unverifiable policy fails closed.
  foundationSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
    properties:
      vocabularyRef:
        type: string
        minLength: 1
      foundationUse:
        type: string
        minLength: 1
  valueSchema:
    type: object
    additionalProperties: false
    required:
      - vocabularyRef
      - foundationUse
      - version
      - canonicalArtifact
      - pathProfile
      - policyClasses
      - policyPrecedence
      - ruleGrammar
      - mutationLimits
      - batchSemantics
      - contentReadability
      - inlineEvidence
      - directMetadataTargets
      - hiddenPathOutcome
      - authorizedUnsatisfiableRangeStatus
      - rangeRouting
      - policySnapshot
      - contentFailurePrecedence
    properties:
      vocabularyRef:
        type: string
        minLength: 1
      foundationUse:
        type: string
        minLength: 1
      version:
        type: string
        enum: ['1.1.0']
      canonicalArtifact:
        type: string
        minLength: 1
        maxLength: 256
      pathProfile:
        type: object
        additionalProperties: false
        required: [characterProfile, maximumCharacters, unicodeNormalization, collisionComparison, componentCollisionComparison, callerSpelling, linkHandling, trailingSpaceOrDot, restrictedRoots]
        properties:
          characterProfile: { type: string, minLength: 1, maxLength: 64 }
          maximumCharacters: { type: integer, const: 500 }
          unicodeNormalization: { type: string, enum: [NFC] }
          collisionComparison: { type: string, enum: [ordinal-ignore-case] }
          componentCollisionComparison: { type: string, enum: [ordinal-ignore-case] }
          callerSpelling: { type: string, enum: [preserve-without-retargeting] }
          linkHandling: { type: string, enum: [reject-touched-entry-or-ancestor-without-following] }
          trailingSpaceOrDot: { type: string, enum: [reject] }
          restrictedRoots:
            type: array
            minItems: 1
            maxItems: 1
            uniqueItems: true
            items: { type: string, enum: [.git] }
      policyClasses:
        type: array
        minItems: 4
        maxItems: 4
        uniqueItems: true
        items: { type: string, enum: [content_allowed, metadata_only, excluded, restricted] }
      policyPrecedence:
        type: object
        additionalProperties: false
        required: [includeAllowlistRequired, exclusionsAlwaysWin, reInclusionSupported, invalidOrUnavailablePolicy]
        properties:
          includeAllowlistRequired: { type: boolean, const: true }
          exclusionsAlwaysWin: { type: boolean, const: true }
          reInclusionSupported: { type: boolean, const: false }
          invalidOrUnavailablePolicy: { type: string, enum: [fail-closed] }
      ruleGrammar:
        type: object
        additionalProperties: false
        required: [anchoring, comparison, minimumRules, maximumRules, minimumRuleCharacters, maximumRuleCharacters, maximumAggregateCharacters, segmentSeparator, singleSegmentWildcard, singleCharacterWildcard, recursiveWildcard, recursiveWildcardMatches, unsupported]
        properties:
          anchoring: { type: string, enum: [workspace-root] }
          comparison: { type: string, enum: [ordinal-ignore-case] }
          minimumRules: { type: integer, const: 1 }
          maximumRules: { type: integer, const: 100 }
          minimumRuleCharacters: { type: integer, const: 1 }
          maximumRuleCharacters: { type: integer, const: 256 }
          maximumAggregateCharacters: { type: integer, const: 25600 }
          segmentSeparator: { type: string, enum: ['/'] }
          singleSegmentWildcard: { type: string, enum: ['*'] }
          singleCharacterWildcard: { type: string, enum: ['?'] }
          recursiveWildcard: { type: string, enum: [complete-segment-only] }
          recursiveWildcardMatches: { type: string, enum: [zero-or-more-segments] }
          unsupported:
            type: array
            minItems: 5
            maxItems: 5
            uniqueItems: true
            items: { type: string, enum: [escapes, negation, character-classes, braces, re-inclusion] }
      mutationLimits:
        type: object
        additionalProperties: false
        required: [inlineTransportBytes, perFileBytes, maximumChanges, aggregateBytes, validation]
        properties:
          inlineTransportBytes: { type: integer, const: 262144 }
          perFileBytes: { type: integer, const: 1048576 }
          maximumChanges: { type: integer, const: 100 }
          aggregateBytes: { type: integer, const: 10485760 }
          validation: { type: string, enum: [atomic-apply-none-on-any-failure] }
      batchSemantics:
        type: object
        additionalProperties: false
        required: [requestSchema, ordering, operationIdUniqueness, pathUniqueness, removeBytes, publicEndpoints]
        properties:
          requestSchema: { type: string, enum: [MutateFilesRequest] }
          ordering: { type: string, enum: [caller-order] }
          operationIdUniqueness: { type: string, enum: [ordinal-ignore-case] }
          pathUniqueness: { type: string, enum: [ordinal-ignore-case] }
          removeBytes: { type: integer, const: 0 }
          publicEndpoints: { type: string, enum: [matching-one-item-adapters] }
      contentReadability:
        type: object
        additionalProperties: false
        required: [encoding, maximumBytes, allowedControls, binaryAndOtherEncodings, visibleDirectoryClass, truncation]
        properties:
          encoding: { type: string, enum: [strict-utf-8-with-optional-leading-bom] }
          maximumBytes: { type: integer, const: 1048576 }
          allowedControls:
            type: array
            minItems: 3
            maxItems: 3
            uniqueItems: true
            items: { type: string, enum: [tab, carriage-return, line-feed] }
          binaryAndOtherEncodings: { type: string, enum: [metadata-only] }
          visibleDirectoryClass: { type: string, enum: [metadata_only] }
          truncation: { type: string, enum: [forbidden] }
      inlineEvidence:
        type: object
        additionalProperties: false
        required: [decodedByteMaximum, decodedLength, trustedHash, malformedOrMismatched]
        properties:
          decodedByteMaximum: { type: integer, const: 262144 }
          decodedLength: { type: string, enum: [equals-byteLength] }
          trustedHash: { type: string, enum: [equals-contentHashReference] }
          malformedOrMismatched: { type: string, enum: [content_evidence_invalid] }
      directMetadataTargets:
        type: object
        additionalProperties: false
        required: [mixedHiddenOrMissing, visibleSubset]
        properties:
          mixedHiddenOrMissing: { type: string, enum: [reject-whole-request] }
          visibleSubset: { type: string, enum: [forbidden] }
      hiddenPathOutcome:
        type: object
        additionalProperties: false
        required: [status, category, code]
        properties:
          status: { type: integer, const: 404 }
          category: { type: string, enum: [tenant_access_denied] }
          code: { type: string, enum: [resource_unavailable] }
      authorizedUnsatisfiableRangeStatus: { type: integer, const: 416 }
      rangeRouting:
        type: object
        additionalProperties: false
        required: [emptyAtEof, startBeyondEof, nonEmptyStartAtEof, endBeyondEofFromVisibleStart]
        properties:
          emptyAtEof: { type: integer, const: 200 }
          startBeyondEof: { type: integer, const: 416 }
          nonEmptyStartAtEof: { type: integer, const: 416 }
          endBeyondEofFromVisibleStart: { type: integer, const: 206 }
      policySnapshot:
        type: object
        additionalProperties: false
        required: [binding, recheckBefore, driftBehavior, unavailableOutcome]
        properties:
          binding: { type: string, enum: [immutable-version-and-digest] }
          recheckBefore:
            type: array
            minItems: 2
            maxItems: 2
            uniqueItems: true
            items: { type: string, enum: [atomic-apply, response-shaping] }
          driftBehavior: { type: string, enum: [discard-and-fail-closed] }
          unavailableOutcome:
            type: object
            additionalProperties: false
            required: [status, category, code, retryable, clientAction]
            properties:
              status: { type: integer, const: 503 }
              category: { type: string, enum: [file_policy_unavailable] }
              code: { type: string, enum: [file_policy_unavailable] }
              retryable: { type: boolean, const: true }
              clientAction: { type: string, enum: [retry] }
      contentFailurePrecedence:
        type: array
        minItems: 3
        maxItems: 3
        prefixItems:
          - type: object
            additionalProperties: false
            required: [condition, status, category, code, retryable, clientAction]
            properties:
              condition: { type: string, enum: [decoded-or-observed-content-above-1048576] }
              status: { type: integer, const: 422 }
              category: { type: string, enum: [input_limit_exceeded] }
              code: { type: string, enum: [file_content_limit_exceeded] }
              retryable: { type: boolean, const: false }
              clientAction: { type: string, enum: [revise_request] }
          - type: object
            additionalProperties: false
            required: [condition, status, category, code, retryable, clientAction]
            properties:
              condition: { type: string, enum: [inline-content-from-262145-through-1048576] }
              status: { type: integer, const: 413 }
              category: { type: string, enum: [input_limit_exceeded] }
              code: { type: string, enum: [d9_inline_limit_exceeded] }
              retryable: { type: boolean, const: true }
              clientAction: { type: string, enum: [revise_request] }
          - type: object
            additionalProperties: false
            required: [condition, status, category, code, retryable, clientAction]
            properties:
              condition: { type: string, enum: [malformed-base64-or-evidence-mismatch] }
              status: { type: integer, const: 400 }
              category: { type: string, enum: [validation_error] }
              code: { type: string, enum: [content_evidence_invalid] }
              retryable: { type: boolean, const: false }
              clientAction: { type: string, enum: [revise_request] }
        items: false
  example:
    version: 1.1.0
    canonicalArtifact: docs/contract/file-context-contract-groups.md
    pathProfile:
      characterProfile: ASCII A-Z a-z 0-9 . _ - /
      maximumCharacters: 500
      unicodeNormalization: NFC
      collisionComparison: ordinal-ignore-case
      componentCollisionComparison: ordinal-ignore-case
      callerSpelling: preserve-without-retargeting
      linkHandling: reject-touched-entry-or-ancestor-without-following
      trailingSpaceOrDot: reject
      restrictedRoots: [.git]
    policyClasses: [content_allowed, metadata_only, excluded, restricted]
    policyPrecedence:
      includeAllowlistRequired: true
      exclusionsAlwaysWin: true
      reInclusionSupported: false
      invalidOrUnavailablePolicy: fail-closed
    ruleGrammar:
      anchoring: workspace-root
      comparison: ordinal-ignore-case
      minimumRules: 1
      maximumRules: 100
      minimumRuleCharacters: 1
      maximumRuleCharacters: 256
      maximumAggregateCharacters: 25600
      segmentSeparator: /
      singleSegmentWildcard: '*'
      singleCharacterWildcard: '?'
      recursiveWildcard: complete-segment-only
      recursiveWildcardMatches: zero-or-more-segments
      unsupported: [escapes, negation, character-classes, braces, re-inclusion]
    mutationLimits: { inlineTransportBytes: 262144, perFileBytes: 1048576, maximumChanges: 100, aggregateBytes: 10485760, validation: atomic-apply-none-on-any-failure }
    batchSemantics: { requestSchema: MutateFilesRequest, ordering: caller-order, operationIdUniqueness: ordinal-ignore-case, pathUniqueness: ordinal-ignore-case, removeBytes: 0, publicEndpoints: matching-one-item-adapters }
    contentReadability: { encoding: strict-utf-8-with-optional-leading-bom, maximumBytes: 1048576, allowedControls: [tab, carriage-return, line-feed], binaryAndOtherEncodings: metadata-only, visibleDirectoryClass: metadata_only, truncation: forbidden }
    inlineEvidence: { decodedByteMaximum: 262144, decodedLength: equals-byteLength, trustedHash: equals-contentHashReference, malformedOrMismatched: content_evidence_invalid }
    directMetadataTargets: { mixedHiddenOrMissing: reject-whole-request, visibleSubset: forbidden }
    hiddenPathOutcome: { status: 404, category: tenant_access_denied, code: resource_unavailable }
    authorizedUnsatisfiableRangeStatus: 416
    rangeRouting: { emptyAtEof: 200, startBeyondEof: 416, nonEmptyStartAtEof: 416, endBeyondEofFromVisibleStart: 206 }
    policySnapshot:
      binding: immutable-version-and-digest
      recheckBefore: [atomic-apply, response-shaping]
      driftBehavior: discard-and-fail-closed
